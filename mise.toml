# mise: single declarative config for this machine.
# Provision with:  cd ~/.dotfiles && mise bootstrap            (personal/work: add -E personal | -E work)
# This file is symlinked to ~/.config/mise/config.toml so [tools] apply globally.

[tools]
java = "zulu-21"
node = "latest"
poetry = "latest"

[settings]
idiomatic_version_file_enable_tools = ["python"]
# python.uv_venv_auto = true

# --- dotfiles: symlinks (replaces GNU stow) --------------------------------
# Source paths are plain names; only the target needs the leading dot, so the
# old stow `dot-` prefix / `pkg/dot-config/pkg` nesting is gone.
[dotfiles]
"~/.gitconfig"               = { source = "~/.dotfiles/git/gitconfig", mode = "symlink" }
"~/.gitignore_global"        = { source = "~/.dotfiles/git/gitignore_global", mode = "symlink" }
"~/.zshenv"                  = { source = "~/.dotfiles/zsh/zshenv", mode = "symlink" }
# Also inside ZDOTDIR: zsh reads $ZDOTDIR/.zshenv, so once ZDOTDIR is exported
# (i.e. any nested zsh) it stops looking at ~/.zshenv. Same file either way.
"~/.config/zsh/.zshenv"      = { source = "~/.dotfiles/zsh/zshenv", mode = "symlink" }
"~/.config/zsh/.zprofile"    = { source = "~/.dotfiles/zsh/zprofile", mode = "symlink" }
"~/.config/zsh/.zshrc"       = { source = "~/.dotfiles/zsh/zshrc", mode = "symlink" }
"~/.config/zsh/path.zsh"     = { source = "~/.dotfiles/zsh/path.zsh", mode = "symlink" }
"~/.config/zsh/aliases"      = { source = "~/.dotfiles/zsh/aliases", mode = "symlink" }
"~/.config/zsh/functions"    = { source = "~/.dotfiles/zsh/functions", mode = "symlink" }
"~/.config/zsh/plugins"      = { source = "~/.dotfiles/zsh/plugins", mode = "symlink" }
"~/.config/zsh/p10k.zsh"     = { source = "~/.dotfiles/zsh/p10k.zsh", mode = "symlink" }
"~/.config/helix"            = { source = "~/.dotfiles/helix", mode = "symlink" }
"~/.config/karabiner"        = { source = "~/.dotfiles/karabiner", mode = "symlink" }
"~/.config/ghostty"          = { source = "~/.dotfiles/ghostty", mode = "symlink" }
"~/.config/mise/config.toml" = { source = "~/.dotfiles/mise.toml", mode = "symlink" }

# --- macOS defaults (replaces the old install script's `defaults write`) ----
[bootstrap.macos.defaults]
"com.googlecode.iterm2" = { PrefsCustomFolder = "~/.dotfiles/iTerm/settings", LoadPrefsFromCustomFolder = true, NoSyncNeverRemindPrefsChangesLostForFile_selection = "0" }

# --- packages: Homebrew still owns packages (it owns the installed casks);
#     mise bootstrap runs `brew bundle` for us as the final step. ------------
[tasks.bootstrap]
description = "Install Homebrew packages from the Brewfile"
run = "brew bundle --file $HOME/.dotfiles/Brewfile"
